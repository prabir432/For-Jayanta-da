<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-size: 30px;
        }
        body{
            padding: 10px;
        }
        .d-flex{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cardboard{
            display: flex;
            height: 700px;
            width: 800px;
            background-image: linear-gradient(45deg, #d00bd7,#6a0fc6,#0000ff);
            border-radius: 10px;
            padding: 20px;
        }
        .logo{
            display: flex;
            gap: 20px;
        }
        .margin{
            margin-top: 30px;
        }
        .form{
            display: flex;
            flex-direction: column;
            width: 500px;
        }
        .submit{
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="cardboard">
        <div>
            <div class="logo">
                 <div ><b>LOGO</b></div>
                 <div ><b>Heading</b></div>
    
            </div>
            <div class="margin">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Commodi aperiam doloremque qui magni laborum quos sapiente id ipsam libero quam. Amet commodi nihil dolorum aut fuga cumque dolore illum repellendus.</p>
            </div>
            <div class="margin">
                <i class="bi bi-twitter-x"></i>
                <i class="bi bi-github"></i>
                <i class="bi bi-discord"></i>

            </div>

        </div>
        <div>
            <form class="form d-flex">
                <h2>Login Form</h2>
                <label for="username">Username:</label>
                <input type="text" placeholder="Enter user name" important!>
                <label for="password">Password:</label>
                <input type="password" placeholder="Enter password" important!>
                <input type="checkbox" important!>
                <label for="checkbox" class="flex">Remember me:</label>
                <input type="submit" class="submit">
                <p></p>
                <i class="bi bi-globe-americas-fill"  class="flex"></i>
                <i class="bi bi-linkedin"  class="flex"></i>
                <i class="bi bi-openai"  class="flex"></i>
            </form>
        </div>
    </div>

</body>
</html>
